<ul>
{% for item in include.items %}
  <li>
    {% if item.items %}
      <details>
        <summary>{{ item.name }}</summary>
        {% include toc.html items=item.items %}
      </details>
    {% else %}
      <a href="{{ item.href | relative_url }}">{{ item.name }}</a>
    {% endif %}
  </li>
{% endfor %}
</ul>
