<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/sidebar.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/page-toc.css' | relative_url }}">

  <script src="{{ '/assets/js/page-toc.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/mathjax.js' | relative_url }}"></script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script type="module" src="{{ '/assets/js/mermaid.js' | relative_url }}"></script>
</head>

<body>
  <div class="layout">

    <aside class="sidebar">
      {% include sidebar.html %}
    </aside>

    <main class="content">
      <h1>{{ page.title }}</h1>
      <div id="page-toc">
        <h2 class="toc-title">目次</h2>
      </div>
      {{ content }}
    </main>

  </div>
</body>
</html>
